name: collect cboe options
run-name: collect ${{ github.event.inputs.mode || 'schedule' }}   # 잡이 다음 잡을 띄울 때 같은 모드가 이미 있는지 이 이름으로 본다

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "am / pm / eod / test(지금 1회, 커밋 안 함) / live(SPX·TSLA 실시간 GEX 1회 갱신) / gth(SPX 야간 거래 1분 갱신)"
        required: true
        default: "am"
        type: choice
        options: [am, pm, eod, test, live, gth]
  # GitHub 예약은 백업용. 외부 크론이 정시에 깨우고, 이건 늦게라도 한 번 더 시도 (이미 받은 회차는 스크립트가 건너뜀)
  schedule:
    - cron: "0 13 * * 1-5"    # am (EDT 9:00 / EST 8:00)
    - cron: "0 17 * * 1-5"    # pm (EDT 13:00 / EST 12:00)
    - cron: "30 22,23 * * 1-5" # eod (마감 스냅샷이 빠졌을 때만 수집)

permissions:
  contents: write
  actions: write   # 끝나기 직전에 다음 잡을 workflow_dispatch로 띄운다(collect_cboe.chain)

# 같은 시간대에 잡이 두 개 뜨면(외부 크론 + GitHub 백업 예약) 하나는 대기시킴.
# 뒤에 도는 잡은 이미 받은 회차를 건너뛰므로 덮어쓰지 않는다.
concurrency:
  group: ${{ github.event.inputs.mode == 'gth' && 'gth' || 'collect' }}   # 야간 잡은 따로 줄 서서 정규장 수집을 막지 않는다
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: ET 날짜
        id: d
        run: echo "day=$(TZ=America/New_York date +%F)" >> $GITHUB_OUTPUT

      # 저장소 전체(수 GB)를 받지 않고 코드·대시보드·오늘 폴더만 받는다
      - uses: actions/checkout@v4
        with:
          # 앞 잡이 끝나길 기다렸다 뜨는 잡(pm)도 지금 시점 main을 받는다. 기본값(github.sha)은 띄운 시점 커밋이라 그 사이 회차 스냅샷이 빠진다
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/*/${{ steps.d.outputs.day }}/

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas numpy

      - name: decide mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 13 * * 1-5") echo "mode=am"  >> $GITHUB_OUTPUT ;;
              "0 17 * * 1-5") echo "mode=pm"  >> $GITHUB_OUTPUT ;;
              *)              echo "mode=eod" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: git 사용자
        run: |
          git config user.name "collector-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: collect (회차마다 대시보드 갱신·커밋, 회차 사이엔 1분마다 실시간 GEX)
        env:
          PUSH_EACH: ${{ steps.m.outputs.mode == 'test' && '0' || '1' }}
          LIVE: ${{ (steps.m.outputs.mode == 'am' || steps.m.outputs.mode == 'pm') && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect_cboe.py ${{ steps.m.outputs.mode }}

      - name: commit (남은 변경분)
        if: always() && steps.m.outputs.mode != 'test' && steps.m.outputs.mode != 'live' && steps.m.outputs.mode != 'gth'
        run: bash commit.sh "collect ${{ steps.m.outputs.mode }} ${{ steps.d.outputs.day }}"
