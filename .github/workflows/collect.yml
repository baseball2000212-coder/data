name: collect cboe options

on:
  schedule:
    # UTC 13:45~21:45 매시 45분 → 서머타임(EDT) 9:45~17:45 / 표준시(EST) 8:45~16:45 (15분 지연 → :30 시세)
    # 스크립트가 ET 기준 9:30~16:45 만 실제 수집하므로 어느 계절이든 장중 8회 정도
    - cron: "45 13-21 * * 1-5"
    # 장마감 후 스냅샷: UTC 22:30 (EDT 18:30) / 23:30 (EST 18:30) 둘 다 걸고 스크립트가 하나만 통과
    - cron: "30 22,23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      - run: python collect_cboe.py

      - name: commit data
        run: |
          git config user.name  "collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "collect $(TZ=America/New_York date '+%F %H:%M ET')"
          git pull --rebase
          git push
