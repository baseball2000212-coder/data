name: collect cboe options

on:
  schedule:
    - cron: "0 22 * * 1-5"   # UTC 22:00 = KST 07:00, 월~금 (미국 장 마감 후)
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      - run: python collect_cboe.py

      - name: commit data
        run: |
          git config user.name  "collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "collect $(TZ=Asia/Seoul date +%F)"
          git push
