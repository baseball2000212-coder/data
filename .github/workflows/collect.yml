name: collect cboe options

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "am / pm / eod"
        required: true
        default: "am"
        type: choice
        options: [am, pm, eod]
  # GitHub 예약은 백업용. 외부 크론이 정시에 깨우고, 이건 늦게라도 한 번 더 시도 (놓친 회차는 스크립트가 건너뜀)
  schedule:
    - cron: "0 13 * * 1-5"    # am (EDT 9:00 / EST 8:00)
    - cron: "0 17 * * 1-5"    # pm (EDT 13:00 / EST 12:00)
    - cron: "30 22,23 * * 1-5" # eod

permissions:
  contents: write

# 같은 시간대에 잡이 두 개 뜨면(외부 크론 + GitHub 백업 예약) 하나는 대기시킴.
# 뒤에 도는 잡은 수집 시각이 다 지나 있어서 아무것도 안 하고 끝남 → 충돌 원천 차단.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas

      - name: decide mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            case "${{ github.event.schedule }}" in
              "0 13 * * 1-5") echo "mode=am"  >> $GITHUB_OUTPUT ;;
              "0 17 * * 1-5") echo "mode=pm"  >> $GITHUB_OUTPUT ;;
              *)              echo "mode=eod" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - run: python collect_cboe.py ${{ steps.m.outputs.mode }}

      - name: commit
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "collect ${{ steps.m.outputs.mode }} $(TZ=America/New_York date +%F)"
          git pull --rebase -X theirs || { git checkout --theirs data 2>/dev/null; git add data; git rebase --continue; }
          git push
