name: pages
# 대시보드 화면(docs/index.html)을 GitHub Pages로 배포한다. 데이터는 화면이 raw.githubusercontent.com 에서 직접 읽으므로
# 화면 파일이 바뀔 때만 배포하면 된다. Settings → Pages → Source 를 "GitHub Actions" 로 한 번 설정해야 한다.
on:
  push:
    branches: [main]
    paths: ["docs/index.html", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: docs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
